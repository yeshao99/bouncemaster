<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>弹跳大师：霓虹冒险</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- 核心基础设置 --- */
        body {
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; 
        }
        canvas {
            display: block;
            touch-action: none;
        }

        /* --- 界面与UI --- */
        .game-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 10;
        }
        .btn {
            pointer-events: auto;
            touch-action: manipulation;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none; -webkit-user-select: none;
        }
        .btn:active { transform: scale(0.95); }

        /* --- 视觉特效 --- */
        
        /* 蓄力条 */
        .power-bar-container {
            position: absolute; right: 30px; top: 50%;
            transform: translateY(-50%);
            width: 16px; height: 180px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 20px; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .power-bar-fill {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            background: linear-gradient(to top, #fbbf24, #ef4444);
            transition: height 0.05s linear;
        }

        /* 玻璃拟态面板 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 首页超级标题特效 */
        .title-container {
            position: relative;
            text-align: center;
            margin-bottom: 4rem;
            animation: slideDown 0.8s ease-out;
        }
        
        .title-text {
            font-size: 5rem;
            font-weight: 900;
            font-style: italic;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255,255,255,0.8);
            background: linear-gradient(to bottom, #fff 0%, #a5f3fc 100%);
            -webkit-background-clip: text;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.4));
            letter-spacing: -2px;
        }
        
        .title-text::after {
            content: "弹跳大师";
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, #22d3ee, #818cf8, #c084fc, #22d3ee);
            background-size: 200%;
            -webkit-background-clip: text;
            color: transparent;
            z-index: -1;
            opacity: 0.7;
            filter: blur(5px);
            animation: glowMove 3s linear infinite;
        }

        @keyframes glowMove {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .title-sub {
            font-size: 1.2rem;
            letter-spacing: 1em;
            color: #93c5fd;
            margin-top: 10px;
            margin-left: 1em;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0.8;
        }

        /* 小球跳跃装饰动画 */
        .title-bouncer-container {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            width: 100%; height: 60px; pointer-events: none;
        }
        .title-ball {
            position: absolute; width: 24px; height: 24px;
            background: #fbbf24; border-radius: 50%;
            box-shadow: 0 0 10px #fbbf24;
            animation: bounceAcrossTitle 3s infinite ease-in-out;
        }
        @keyframes bounceAcrossTitle {
            0% { left: 20%; top: 30px; transform: scaleY(1.1); animation-timing-function: ease-out; }
            25% { left: 35%; top: -10px; transform: scaleY(0.9); animation-timing-function: ease-in; }
            50% { left: 50%; top: 30px; transform: scaleY(1.1); animation-timing-function: ease-out; }
            75% { left: 65%; top: -10px; transform: scaleY(0.9); animation-timing-function: ease-in; }
            100% { left: 80%; top: 30px; transform: scaleY(1.1); animation-timing-function: ease-out; }
        }

        /* 模式卡片 */
        .mode-card {
            position: relative;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            animation: slideUp 0.8s ease-out backwards;
        }
        .mode-card:nth-child(1) { animation-delay: 0.1s; }
        .mode-card:nth-child(2) { animation-delay: 0.2s; }

        .mode-card::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5), transparent);
            opacity: 0.5;
        }
        
        .mode-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.5);
            background: rgba(30, 41, 59, 0.7);
        }
        
        .mode-card:hover .mode-icon {
            transform: scale(1.2) rotate(10deg);
        }

        .mode-icon { transition: transform 0.3s ease; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        .bg-gradient-overlay {
            background: radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.15) 0%, rgba(15, 23, 42, 0) 60%);
            animation: pulseBg 5s ease-in-out infinite alternate;
        }
        @keyframes pulseBg { from { opacity: 0.5; } to { opacity: 1; } }

    </style>
</head>
<body class="text-white">

    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- 游戏UI层 -->
    <div id="uiLayer" class="game-ui">
        <!-- 顶部栏 -->
        <div class="flex justify-between items-start p-6 w-full pointer-events-none">
            <div id="topInfoBar" class="glass-panel px-4 py-2 rounded-full text-lg font-bold shadow-lg flex items-center gap-3" style="display: none;">
                <span id="modeDisplay" class="text-xs uppercase tracking-wider text-gray-400">MODE</span>
                <span id="levelDisplay" class="text-xl text-white">1</span>
            </div>
            <div id="topControls" class="flex space-x-2 pointer-events-auto" style="display: none;">
                <!-- 修复: 确保点击后能正常回到主菜单，并可以重新点击模式按钮 -->
                <button onclick="event.stopPropagation(); game.showScreen('START')" class="btn glass-panel hover:bg-white/10 text-white p-3 rounded-full shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </button>
                <button onclick="event.stopPropagation(); game.resetLevel()" class="btn glass-panel hover:bg-white/10 text-white p-3 rounded-full shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- 蓄力条 -->
        <div class="power-bar-container" id="powerBarContainer" style="display: none;">
            <div id="powerBar" class="power-bar-fill"></div>
        </div>
    </div>

    <!-- 主菜单遮罩层 -->
    <div id="overlay" class="fixed inset-0 flex flex-col items-center justify-center z-50 pointer-events-none" style="display: flex;">
        <!-- 动态氛围背景 -->
        <div class="absolute inset-0 bg-gradient-to-b from-slate-900/60 via-slate-900/80 to-slate-900/95 backdrop-blur-[3px]"></div>
        <div class="absolute inset-0 bg-gradient-overlay pointer-events-none"></div>

        <div class="relative z-30 flex flex-col items-center w-full max-w-md px-6 pointer-events-auto">
            
            <div class="title-container">
                <div class="title-bouncer-container">
                    <div class="title-ball"></div>
                </div>
                <h1 id="overlayTitle" class="title-text">弹跳大师</h1>
                <p class="title-sub">BOUNCE MASTER</p>
            </div>
            
            <div id="startMenuButtons" class="w-full flex flex-col gap-6 px-2">
                <button onclick="event.stopPropagation(); game.startMode('easy')" class="mode-card btn w-full py-5 rounded-2xl shadow-lg flex items-center justify-between px-8 group border-l-4 border-l-cyan-400">
                    <div class="flex flex-col items-start">
                        <span class="text-2xl font-bold tracking-widest text-cyan-50">简单模式</span>
                        <span class="text-xs text-cyan-300/70 font-medium mt-1">20关 • 休闲闯关</span>
                    </div>
                    <span class="text-4xl mode-icon">🌱</span>
                </button>

                <button onclick="event.stopPropagation(); game.startMode('hard')" class="mode-card btn w-full py-5 rounded-2xl shadow-lg flex items-center justify-between px-8 group border-l-4 border-l-fuchsia-500">
                    <div class="flex flex-col items-start">
                        <span class="text-2xl font-bold tracking-widest text-fuchsia-50">困难模式</span>
                        <span class="text-xs text-fuchsia-300/70 font-medium mt-1">2关 • 史诗挑战</span>
                    </div>
                    <span class="text-4xl mode-icon">🔥</span>
                </button>
            </div>

            <button id="actionBtn" class="btn hidden w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-full text-xl font-bold shadow-lg mt-8 border border-white/20 transform transition-transform hover:scale-105">
                下一步
            </button>
        </div>
    </div>

    <script>
        // --- 游戏内核 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // DOM 引用
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const startMenuButtons = document.getElementById('startMenuButtons');
        const actionBtn = document.getElementById('actionBtn');
        const levelDisplay = document.getElementById('levelDisplay');
        const modeDisplay = document.getElementById('modeDisplay');
        const powerBar = document.getElementById('powerBar');
        const powerBarContainer = document.getElementById('powerBarContainer');
        const topInfoBar = document.getElementById('topInfoBar');
        const topControls = document.getElementById('topControls');

        // 物理常量
        const GRAVITY = 0.5; 
        const FRICTION = 0.85; 
        const AIR_RESISTANCE = 0.98; 
        const MOVE_SPEED = 0.8; 
        const MAX_SPEED_X = 7; 
        const JUMP_CHARGE_RATE = 0.5; 
        const MAX_JUMP_FORCE = 19; 
        const MIN_JUMP_FORCE = 5; 
        
        // 游戏全局状态
        const gameState = {
            screen: 'START', // START, PLAYING, GAMEOVER, WIN, LEVEL_COMPLETE
            mode: 'easy', 
            currentLevel: 0,
            charging: false,
            chargePower: 0,
            keys: { left: false, right: false, space: false },
            time: 0,
            touchStartX: 0, 
            touchCurrentX: 0
        };

        // --- 摄像机系统 (智能运镜 4.0 - 平滑视野预判, 减弱垂直预测) ---
        const camera = {
            x: 0, y: 0, width: 0, height: 0,
            targetX: 0, targetY: 0,
            currentRatioY: 0.55, // 垂直比例，用于平滑过渡
            
            follow: function(target) {
                // 演示模式
                if (gameState.screen === 'START') {
                    this.targetX = target.x - this.width / 2;
                    this.targetY = target.y - this.height / 2;
                    this.x += (this.targetX - this.x) * 0.1;
                    this.y += (this.targetY - this.y) * 0.05;
                    return;
                }

                // 游戏模式：平滑构图
                
                // 1. 水平跟随
                const lookAheadX = target.vx * 20; 
                this.targetX = target.x + lookAheadX - this.width * 0.4; 
                
                // 2. 垂直跟随 (减弱预测效果)
                let targetRatioY = 0.55; // 默认：球在屏幕中间略偏下
                const vyThreshold = 3;

                if (target.vy < -vyThreshold) {
                    // 向上跳：球在屏幕下方 70% 处，看天 (减弱至 0.7)
                    targetRatioY = 0.7; 
                } else if (target.vy > vyThreshold) {
                    // 向下落：球在屏幕上方 35% 处，看地 (减弱至 0.35)
                    targetRatioY = 0.35; 
                }
                
                // 平滑过渡 Ratio，使用更小的 lerp 值，减弱跟随速度
                const ratioLerp = 0.08; 
                this.currentRatioY += (targetRatioY - this.currentRatioY) * ratioLerp;
                
                // 计算目标Y
                const idealY = target.y - (this.height * this.currentRatioY);
                this.targetY = idealY;

                // 3. 摄像机移动
                this.x += (this.targetX - this.x) * 0.1;
                this.y += (this.targetY - this.y) * 0.1; 
                
                if(this.x < -200) this.x = -200;
            }
        };

        // --- 背景系统 ---
        const background = {
            stars: [],
            init: function() {
                this.stars = [];
                for(let i=0; i<60; i++) {
                    this.stars.push({
                        x: Math.random() * 2000, 
                        y: Math.random() * 1000, 
                        size: Math.random() * 2 + 0.5,
                        alpha: Math.random()
                    });
                }
            },
            draw: function(ctx, camX, camY) {
                const w = canvas.width;
                const h = canvas.height;
                
                const grd = ctx.createLinearGradient(0, 0, 0, h);
                grd.addColorStop(0, '#020617'); 
                grd.addColorStop(1, '#1e293b'); 
                
                if (gameState.screen === 'START') {
                    grd.addColorStop(1, '#172554');
                }
                
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, w, h);

                ctx.save();
                ctx.translate(-camX * 0.05, -camY * 0.05);
                ctx.fillStyle = 'white';
                this.stars.forEach(s => {
                    const flicker = Math.sin(gameState.time * 0.05 + s.x) * 0.3;
                    ctx.globalAlpha = Math.max(0.1, s.alpha + flicker);
                    ctx.beginPath();
                    ctx.arc((s.x + camX * 0.1) % 2000, s.y, s.size, 0, Math.PI*2);
                    ctx.fill();
                });
                ctx.restore();

                if (gameState.screen === 'START') {
                    // 简化的网格，减少绘制消耗
                    ctx.save();
                    const perspectiveY = h * 0.4; 
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(236, 72, 153, 0.15)'; 
                    ctx.lineWidth = 1;
                    
                    const spacing = 150;
                    const moveX = -camX * 0.5 % spacing;
                    
                    // 仅绘制视野内的线条
                    const totalLines = Math.ceil(w / spacing) + 2;
                    
                    for(let i = -1; i < totalLines; i++) {
                        const x = i * spacing + moveX;
                        ctx.moveTo(x, h);
                        ctx.lineTo(x + (x - w/2) * 0.5, perspectiveY); 
                    }
                    
                    const gridTime = (gameState.time * 2) % 100;
                    for(let i = 0; i < 15; i++) { // 减少横线条数
                        const y = h - (i * i * 4) + (gridTime * (i*0.1)); 
                        if (y < perspectiveY) continue;
                        ctx.moveTo(0, y);
                        ctx.lineTo(w, y);
                    }
                    ctx.stroke();
                    ctx.restore();
                }
            }
        };

        // --- 游戏对象 ---
        class Ball {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.radius = 14;
                this.vx = 0; this.vy = 0;
                this.isGrounded = false;
                this.canDoubleJump = true; 
                this.squashX = 1; this.squashY = 1;
                this.dead = false;
                this.trail = []; 
                this.autoMode = false;
            }
            update() {
                // 状态卫兵
                if (gameState.screen !== 'PLAYING' && !this.autoMode) return;

                if (this.dead) {
                    if (this.autoMode) this.resetDemo();
                    return;
                }

                // 性能优化：限制拖尾数量和更新频率
                if (gameState.time % 3 === 0 && (Math.abs(this.vx) > 1 || Math.abs(this.vy) > 1)) {
                    this.trail.push({x: this.x, y: this.y, alpha: 0.5, r: this.radius});
                    if (this.trail.length > 6) this.trail.shift(); // 减少最大拖尾数
                }

                if (this.autoMode) {
                    this.vx = 4;
                    if (this.isGrounded) this.jump(13);
                    if (this.x > 5000) this.resetDemo();
                } else {
                    if (gameState.keys.left) this.vx -= MOVE_SPEED;
                    if (gameState.keys.right) this.vx += MOVE_SPEED;

                    if (gameState.keys.space && (this.isGrounded || this.canDoubleJump)) {
                        gameState.charging = true;
                        
                        // 减少粒子生成频率
                        if (!this.isGrounded) {
                            if (Math.random() < 0.3) createParticles(this.x + (Math.random()-0.5)*20, this.y + this.radius, 1, '#60a5fa'); 
                        } else {
                            if (Math.random() < 0.2) createParticles(this.x + (Math.random()-0.5)*20, this.y + this.radius, 1, '#fbbf24');
                        }
                        if (gameState.chargePower < MAX_JUMP_FORCE) gameState.chargePower += JUMP_CHARGE_RATE;
                        const squashFactor = 1 - (gameState.chargePower / MAX_JUMP_FORCE) * 0.4;
                        this.squashY = squashFactor;
                        this.squashX = 1 + (1 - squashFactor) * 0.8;
                    } else {
                        if (gameState.charging) {
                            if (!this.isGrounded) {
                                this.canDoubleJump = false;
                                createParticles(this.x, this.y, 8, '#3b82f6'); // 减少粒子数
                            }
                            this.jump(Math.max(MIN_JUMP_FORCE, gameState.chargePower));
                            gameState.charging = false;
                            gameState.chargePower = 0;
                        }
                        this.squashX += (1 - this.squashX) * 0.15;
                        this.squashY += (1 - this.squashY) * 0.15;
                    }
                }

                this.vy += GRAVITY;
                this.vx *= this.isGrounded ? FRICTION : AIR_RESISTANCE;
                
                if (this.vx > MAX_SPEED_X) this.vx = MAX_SPEED_X;
                if (this.vx < -MAX_SPEED_X) this.vx = -MAX_SPEED_X;

                this.x += this.vx; this.y += this.vy;
                
                if (this.y > camera.y + camera.height + 300 || this.y > 3000) {
                    if (this.autoMode) this.resetDemo();
                    else game.gameOver("坠入深渊");
                }
            }
            
            resetDemo() {
                this.x = 0; this.y = 400; this.vx = 0; this.vy = 0; this.dead = false; camera.x = -200;
            }

            jump(force) {
                this.vy = -force;
                this.isGrounded = false;
                createParticles(this.x, this.y + this.radius, 6, '#fff'); // 减少粒子数
            }

            draw(ctx) {
                if (this.dead) return;
                
                // 绘制拖尾 (无阴影)
                this.trail.forEach(t => {
                    t.alpha -= 0.08; t.r *= 0.85;
                    if(t.alpha > 0) {
                        ctx.fillStyle = `rgba(56, 189, 248, ${t.alpha})`; 
                        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2); ctx.fill();
                    }
                });
                this.trail = this.trail.filter(t => t.alpha > 0);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.squashX, this.squashY);
                
                // 使用半透明圆代替 shadowBlur 提升性能
                if (!this.isGrounded && this.canDoubleJump) {
                    ctx.fillStyle = "rgba(96, 165, 250, 0.3)";
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + 5, 0, Math.PI*2); ctx.fill();
                }
                
                const grd = ctx.createRadialGradient(-4, -4, 2, 0, 0, this.radius);
                grd.addColorStop(0, '#e0f2fe'); grd.addColorStop(0.5, '#38bdf8'); grd.addColorStop(1, '#0ea5e9'); 
                
                ctx.fillStyle = gameState.charging ? `rgb(255, ${200 * (1-gameState.chargePower / MAX_JUMP_FORCE)}, 100)` : grd;
                
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
                
                // 眼睛
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(5, -3, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(-5, -3, 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#0f172a';
                const lookX = this.vx * 0.3; const lookY = this.vy * 0.3;
                ctx.beginPath(); ctx.arc(5 + lookX, -3 + lookY, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(-5 + lookX, -3 + lookY, 1.5, 0, Math.PI*2); ctx.fill();
                
                ctx.restore();
            }
        }

        class Platform {
            constructor(x, y, w, h, type, props = {}) {
                this.x = x; this.y = y; this.w = w; this.h = h; this.type = type;
                this.active = true;
                this.initialX = x;
                this.crumbleTimer = 0;
                this.isCrumbling = false;
                this.angle = 0;
                this.radius = props.radius || 30; 
            }
            
            update() {
                if (this.isCrumbling) {
                    this.crumbleTimer++;
                    if (this.crumbleTimer > 60) {
                        this.active = false;
                        createParticles(this.x + this.w/2, this.y + this.h/2, 8, '#94a3b8');
                    }
                }
                if (this.type === 'saw') this.angle += 0.1;
            }

            draw(ctx) {
                if (!this.active) return;
                
                // 性能优化：移除所有 shadowBlur，用颜色层代替
                if (this.type === 'normal' || this.type === 'fragile') {
                    if (this.type === 'fragile') {
                        if (this.isCrumbling) {
                            const shake = (Math.random() - 0.5) * 4;
                            ctx.translate(shake, shake);
                            ctx.fillStyle = '#ef4444'; 
                        } else {
                            ctx.fillStyle = '#64748b'; 
                        }
                    } else {
                        ctx.fillStyle = '#1e293b'; 
                    }

                    ctx.fillRect(this.x, this.y, this.w, this.h);
                    ctx.lineWidth = 2; ctx.strokeStyle = '#334155'; ctx.strokeRect(this.x, this.y, this.w, this.h);
                    
                    if (this.type !== 'fragile') {
                        ctx.fillStyle = '#4ade80'; ctx.fillRect(this.x, this.y, this.w, 4);
                        // 模拟光晕
                        ctx.fillStyle = 'rgba(74, 222, 128, 0.3)'; ctx.fillRect(this.x, this.y-2, this.w, 2);
                    } else {
                         ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(this.x + 10, this.y + 10); ctx.lineTo(this.x + this.w - 10, this.y + this.h - 10); ctx.stroke();
                    }
                    if (this.isCrumbling && this.type === 'fragile') ctx.translate(0, 0); 

                } else if (this.type === 'spike') {
                    ctx.fillStyle = '#991b1b'; 
                    const spikeWidth = 20; const spikeCount = Math.floor(this.w / spikeWidth);
                    ctx.beginPath();
                    for(let i=0; i<spikeCount; i++) {
                        ctx.moveTo(this.x + i * spikeWidth, this.y + this.h);
                        ctx.lineTo(this.x + i * spikeWidth + spikeWidth/2, this.y);
                        ctx.lineTo(this.x + i * spikeWidth + spikeWidth, this.y + this.h);
                    }
                    const grd = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
                    grd.addColorStop(0, '#fca5a5'); grd.addColorStop(1, '#7f1d1d'); 
                    ctx.fillStyle = grd; ctx.fill();

                } else if (this.type === 'saw') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.fillStyle = '#b91c1c';
                    ctx.beginPath();
                    const teeth = 8; const outerRadius = this.radius; const innerRadius = this.radius * 0.5;
                    for (let i = 0; i < teeth * 2; i++) {
                        const r = (i % 2 === 0) ? outerRadius : innerRadius;
                        const a = (Math.PI * 2 * i) / (teeth * 2);
                        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                    }
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#450a0a'; ctx.beginPath(); ctx.arc(0,0, innerRadius/2, 0, Math.PI*2); ctx.fill();
                    ctx.restore();

                } else if (this.type === 'goal') {
                    ctx.save();
                    const cx = this.x + this.w/2; const cy = this.y + this.h/2;
                    ctx.translate(cx, cy); ctx.rotate(gameState.time * 0.05);
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 4; ctx.setLineDash([10, 10]);
                    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.stroke();
                    ctx.fillStyle = 'rgba(16, 185, 129, 0.2)'; // 替代阴影
                    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ecfdf5';
                    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                } else if (this.type === 'text') {
                    ctx.save();
                    ctx.fillStyle = "rgba(255,255,255,0.7)";
                    ctx.font = "bold 20px 'Segoe UI'";
                    ctx.fillText(this.w, this.x, this.y);
                    ctx.restore();
                }
            }
        }

            const levels = [];

            let baseLength = 1500;
            for(let i=2; i<=20; i++) {
                const len = baseLength * Math.pow(1.3, i - 1);
                const spikeProb = Math.min(0.5, 0.2 + i * 0.02);
                const sawProb = i > 5 ? Math.min(0.3, 0.1 + i * 0.01) : 0;

            checkCollisions: function() {
                if (gameState.screen !== 'PLAYING' && !this.ball.autoMode) return;

                const ball = this.ball;
                if (ball.dead) return;
                ball.isGrounded = false;

                for (let p of this.platforms) {
                    if (!p.active) continue;
                    if (p.type === 'text') continue;

                    if (p.type === 'saw') {
                        const dx = ball.x - p.x; const dy = ball.y - p.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < ball.radius + p.radius) {
                             if (!ball.autoMode) this.gameOver("被锯齿撕裂");
                             else ball.dead = true;
                        }
                        continue;
                    }

                    let closestX = Math.max(p.x, Math.min(ball.x, p.x + p.w));
                    let closestY = Math.max(p.y, Math.min(ball.y, p.y + p.h));
                    let dx = ball.x - closestX; let dy = ball.y - closestY;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < ball.radius) {
                        if (p.type === 'spike') {
                            const hitTop = ball.vy > 0 && ball.y < p.y + 15; 
                            if (hitTop) {
                                if (!ball.autoMode) this.gameOver("接触危险尖刺");
                                else ball.dead = true;
                                return;
                            } else {
                                if (Math.abs(dx) > Math.abs(dy)) {
                                    ball.vx *= -0.8;
                                    ball.x += dx > 0 ? 2 : -2;
                                } else {
                                    ball.vy *= -0.8;
                                    ball.y += dy > 0 ? 2 : -2;
                                }
                            }
                        } else if (p.type === 'goal') {
                            if (!ball.autoMode) this.showScreen('LEVEL_COMPLETE');
                            else this.ball.resetDemo();
                            return;
                        } else if (p.type === 'normal' || p.type === 'fragile') {
                            const isFalling = ball.vy >= 0;
                            const isAbove = ball.y < p.y + p.h / 2; 
                            const isAligned = ball.x > p.x - ball.radius * 0.5 && ball.x < p.x + p.w + ball.radius * 0.5;

                            if (isFalling && isAbove && isAligned) {
                                ball.y = p.y - ball.radius; ball.vy = 0;
                                ball.isGrounded = true; ball.canDoubleJump = true; 
                                if (p.type === 'fragile') p.isCrumbling = true; 
                                if (Math.abs(ball.vy) > 2) createParticles(ball.x, ball.y + ball.radius, 3, '#4ade80');
                            } else if (ball.vy < 0 && ball.y > p.y + p.h - ball.radius && isAligned) {
                                ball.y = p.y + p.h + ball.radius; ball.vy *= -0.5;
                            } else {
                                 if (ball.x < p.x + p.w / 2) { 
                                    ball.x = p.x - ball.radius; ball.vx = -Math.abs(ball.vx) * 0.5; 
                                 } else { 
                                    ball.x = p.x + p.w + ball.radius; ball.vx = Math.abs(ball.vx) * 0.5; 
                                 }
                            }
                        }
                    }
                }
            },

            // 新增: 查找下一个非可见平台
            findNextPlatform: function() {
                if (!this.ball || this.ball.isGrounded || this.ball.dead) return null;
                
                // 过滤掉当前关卡中在球右侧、且未死亡的平台
                let candidates = this.platforms.filter(p => 
                    p.active && 
                    p.type !== 'text' && 
                    p.x + p.w / 2 > this.ball.x
                );

                if (candidates.length === 0) return null;

                // 找到最近的平台（按X轴距离）
                candidates.sort((a, b) => a.x - b.x);

                const nextPlatform = candidates[0];
                
                // 检查平台是否在视野内
                const camRight = camera.x + camera.width;
                const camBottom = camera.y + camera.height;
                const camTop = camera.y;
                
                const isVisible = (
                    nextPlatform.x < camRight && 
                    nextPlatform.x + nextPlatform.w > camera.x && 
                    nextPlatform.y < camBottom && 
                    nextPlatform.y + nextPlatform.h > camTop
                );
                
                return isVisible ? null : nextPlatform; // 只有非可见的才返回
            },

            // 新增: 绘制非可见平台提示
            drawOffScreenHint: function() {
                const nextPlatform = this.findNextPlatform();
                if (!nextPlatform) return; 
                
                ctx.save();

                const canvasWidth = canvas.width;
                const canvasHeight = canvas.height;
                const platCenterY = nextPlatform.y + nextPlatform.h / 2;
                
                // 1. 将世界 Y 坐标转换为屏幕 Y 坐标
                let screenY = platCenterY - camera.y;

                // 2. 钳制 screen Y，使其停留在屏幕边缘内 (50 像素安全边距)
                const margin = 50;
                screenY = Math.max(margin, Math.min(canvasHeight - margin, screenY));

                const hintSize = 10;
                const indicatorX = canvasWidth - 15; // 屏幕右侧边缘

                // 绘制指示器光晕背景 (Screen Space)
                ctx.fillStyle = 'rgba(255, 165, 0, 0.15)'; // 柔和的橙色光晕
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255, 165, 0, 0.8)';
                ctx.beginPath();
                ctx.arc(indicatorX, screenY, hintSize * 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制箭头 (Screen Space)
                ctx.fillStyle = '#facc15'; // 亮黄色箭头
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(indicatorX - hintSize * 1.5, screenY);
                ctx.lineTo(indicatorX - hintSize * 0.2, screenY - hintSize);
                ctx.lineTo(indicatorX - hintSize * 0.2, screenY + hintSize);
                ctx.closePath();
                ctx.fill();
                
                // 绘制中心点 (Screen Space)
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(indicatorX - hintSize * 0.2, screenY, hintSize / 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            },

            update: function() {
                gameState.time++;
                this.platforms.forEach(p => p.update()); 
                if (this.ball) this.ball.update();
                this.checkCollisions();
                for(let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.vy += p.gravity; 
                    p.life -= 0.03; p.size *= 0.95;
                    if(p.life <= 0) particles.splice(i, 1);
                }
                if (this.ball) camera.follow(this.ball);
                if (gameState.screen === 'PLAYING') {
                     powerBar.style.height = gameState.charging ? (gameState.chargePower / MAX_JUMP_FORCE * 100) + '%' : '0%';
                }
            },

            draw: function() {
                // 1. 绘制背景 (World Space)
                background.draw(ctx, camera.x, camera.y);
                
                // 2. 绘制世界对象 (World Space)
                ctx.save();
                ctx.translate(-camera.x, -camera.y);
                this.platforms.forEach(p => p.draw(ctx));
                if (this.ball) this.ball.draw(ctx);
                particles.forEach(p => {
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1.0;
                });
                ctx.restore(); // 结束世界坐标转换

                // 3. 绘制屏幕提示 (Screen Space)
                if (gameState.screen === 'PLAYING') {
                    this.drawOffScreenHint();
                }
            },

            setupInputs: function() {
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'ArrowLeft') gameState.keys.left = true;
                    if (e.code === 'ArrowRight') gameState.keys.right = true;
                    if (e.code === 'Space') gameState.keys.space = true;
                });
                window.addEventListener('keyup', (e) => {
                    if (e.code === 'ArrowLeft') gameState.keys.left = false;
                    if (e.code === 'ArrowRight') gameState.keys.right = false;
                    if (e.code === 'Space') gameState.keys.space = false;
                });
                
                const handleTouchStart = (e) => {
                    if (e.target.closest('.btn') || e.target.tagName === 'BUTTON') return;
                    if (gameState.screen === 'PLAYING') {
                        e.preventDefault(); e.stopPropagation();
                    }
                    if (gameState.screen !== 'PLAYING') return; 
                    gameState.keys.space = true;
                    if(e.touches.length > 0) {
                        gameState.touchStartX = e.touches[0].clientX;
                        gameState.touchCurrentX = gameState.touchStartX;
                    }
                };
                const handleTouchMove = (e) => {
                    if (!gameState.keys.space) return;
                    e.preventDefault();
                    if(e.touches.length > 0) {
                        gameState.touchCurrentX = e.touches[0].clientX;
                        const delta = gameState.touchCurrentX - gameState.touchStartX;
                        const threshold = 15; 
                        if (delta < -threshold) { gameState.keys.left = true; gameState.keys.right = false; }
                        else if (delta > threshold) { gameState.keys.right = true; gameState.keys.left = false; }
                        else { gameState.keys.left = false; gameState.keys.right = false; }
                    }
                };
                const handleTouchEnd = (e) => {
                    if (gameState.keys.space) {
                        e.preventDefault();
                        gameState.keys.space = false; gameState.keys.left = false; gameState.keys.right = false;
                    }
                };
                window.addEventListener('touchstart', handleTouchStart, {passive: false});
                window.addEventListener('touchmove', handleTouchMove, {passive: false});
                window.addEventListener('touchend', handleTouchEnd, {passive: false});
            }
        };

        function loop() {
            game.update();
            game.draw();
            requestAnimationFrame(loop);
        }

        game.init();
        loop();

    </script>
</body>
</html>
