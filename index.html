<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>弹跳大师：霓虹冒险</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 防止手机端下拉刷新和双击缩放 */
        body {
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
        }
        canvas {
            display: block;
        }
        .game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .btn {
            pointer-events: auto;
            touch-action: manipulation;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* 蓄力条样式优化 */
        .power-bar-container {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 180px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .power-bar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #fbbf24, #ef4444);
            transition: height 0.05s linear;
            box-shadow: 0 0 10px #ef4444;
        }
        /* 玻璃拟态UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* 手势提示动画 */
        .gesture-hint {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.8;
            animation: fadePulse 2s infinite;
            pointer-events: none;
        }
        @keyframes fadePulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        .finger-icon {
            width: 40px;
            height: 40px;
            border: 2px solid white;
            border-radius: 50%;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.2);
        }
        /* 标题文字丰富色彩 */
        .title-gradient {
            background: linear-gradient(to right, #34d399, #22d3ee, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 5s linear infinite;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
        
        /* 标题上的小球跳跃动画 */
        .title-bouncer-container {
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 40px;
            pointer-events: none;
        }
        .title-ball {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #fbbf24;
            border-radius: 50%;
            box-shadow: 0 0 10px #fbbf24;
            animation: bounceAcross 2.5s infinite ease-in-out;
        }
        @keyframes bounceAcross {
            0% { left: 10%; top: 20px; transform: scaleY(1.1); animation-timing-function: ease-out; }
            10% { left: 18%; top: -20px; transform: scaleY(0.9); animation-timing-function: ease-in; }
            20% { left: 26%; top: 20px; transform: scaleY(1.1); animation-timing-function: ease-out; }
            30% { left: 34%; top: -15px; transform: scaleY(0.9); animation-timing-function: ease-in; }
            40% { left: 42%; top: 20px; transform: scaleY(1.1); animation-timing-function: ease-out; }
            50% { left: 50%; top: -25px; transform: scaleY(0.9); animation-timing-function: ease-in; }
            60% { left: 58%; top: 20px; transform: scaleY(1.1); animation-timing-function: ease-out; }
            70% { left: 66%; top: -15px; transform: scaleY(0.9); animation-timing-function: ease-in; }
            80% { left: 74%; top: 20px; transform: scaleY(1.1); animation-timing-function: ease-out; }
            90% { left: 82%; top: -20px; transform: scaleY(0.9); animation-timing-function: ease-in; }
            100% { left: 90%; top: 20px; transform: scaleY(1.1); animation-timing-function: ease-out; }
        }

        /* 模式选择按钮 */
        .mode-card {
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .mode-card:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="text-white">

    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 游戏UI层 -->
    <div id="uiLayer" class="game-ui">
        
        <!-- 顶部信息 -->
        <div class="flex justify-between items-start p-6 w-full pointer-events-none">
            <div id="topInfoBar" class="glass-panel px-4 py-2 rounded-full text-lg font-bold shadow-lg flex items-center gap-3" style="display: none;">
                <span id="modeDisplay" class="text-xs uppercase tracking-wider text-gray-400">MODE</span>
                <span id="levelDisplay" class="text-xl text-white">1</span>
            </div>
            <div id="topControls" class="flex space-x-2 pointer-events-auto" style="display: none;">
                <button onclick="game.showScreen('START')" class="btn glass-panel hover:bg-white/10 text-white p-3 rounded-full shadow-lg group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white group-hover:rotate-90 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </button>
                <button onclick="game.resetLevel()" class="btn glass-panel hover:bg-white/10 text-white p-3 rounded-full shadow-lg group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-400 group-hover:rotate-180 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 蓄力指示条 -->
        <div class="power-bar-container" id="powerBarContainer" style="display: none;">
            <div id="powerBar" class="power-bar-fill"></div>
        </div>

        <!-- 教学提示 -->
        <div id="tutorialHint" class="gesture-hint" style="display: none;">
            <div class="finger-icon"></div>
            <div class="text-center text-sm font-bold text-blue-200 bg-black/50 px-3 py-1 rounded-lg backdrop-blur-sm">
                按住蓄力<br>左右滑动移动
            </div>
        </div>
    </div>

    <!-- 主菜单遮罩层 -->
    <div id="overlay" class="fixed inset-0 flex flex-col items-center justify-center z-50 pointer-events-none" style="display: flex;">
        <!-- 黑色渐变遮罩，确保文字清晰，但能看到背后的动态游戏 -->
        <!-- 修改透明度，让背景更清晰一点 -->
        <div class="absolute inset-0 bg-gradient-to-b from-slate-900/30 via-slate-900/50 to-slate-900/80 backdrop-blur-[1px]"></div>

        <div class="relative z-10 flex flex-col items-center w-full max-w-md px-6 pointer-events-auto">
            
            <!-- 标题区域 -->
            <div class="relative w-full text-center mb-16">
                <!-- 跳跃的小球 -->
                <div class="title-bouncer-container">
                    <div class="title-ball"></div>
                </div>
                <!-- 标题文字 -->
                <h1 id="overlayTitle" class="text-7xl font-black title-gradient tracking-tighter italic transform -rotate-2 drop-shadow-lg">
                    弹跳大师
                </h1>
                <p id="overlayDesc" class="text-blue-200/80 mt-2 text-center text-sm tracking-[0.8em] font-light">
                    BOUNCE MASTER
                </p>
            </div>
            
            <div id="startMenuButtons" class="w-full flex flex-col gap-5 px-4">
                <!-- 简单模式 -->
                <button onclick="game.startMode('easy')" class="mode-card btn w-full py-5 bg-gradient-to-r from-cyan-500/80 to-blue-500/80 rounded-2xl shadow-lg group relative overflow-hidden">
                    <div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 ease-in-out skew-x-12"></div>
                    <div class="flex items-center justify-center gap-4">
                        <span class="text-3xl">🌱</span>
                        <span class="text-2xl font-bold tracking-widest text-white">简单模式</span>
                    </div>
                </button>

                <!-- 困难模式 -->
                <button onclick="game.startMode('hard')" class="mode-card btn w-full py-5 bg-gradient-to-r from-purple-600/80 to-pink-600/80 rounded-2xl shadow-lg group relative overflow-hidden">
                    <div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 ease-in-out skew-x-12"></div>
                    <div class="flex items-center justify-center gap-4">
                        <span class="text-3xl">🔥</span>
                        <span class="text-2xl font-bold tracking-widest text-white">困难模式</span>
                    </div>
                </button>
            </div>

            <!-- 通用操作按钮 (游戏结束/过关时显示) -->
            <button id="actionBtn" class="btn hidden w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-full text-xl font-bold shadow-[0_0_20px_rgba(59,130,246,0.5)] mt-8">
                下一步
            </button>
        </div>
    </div>

    <script>
        // --- 游戏配置 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // DOM
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const startMenuButtons = document.getElementById('startMenuButtons');
        const actionBtn = document.getElementById('actionBtn');
        const levelDisplay = document.getElementById('levelDisplay');
        const modeDisplay = document.getElementById('modeDisplay');
        const powerBar = document.getElementById('powerBar');
        const powerBarContainer = document.getElementById('powerBarContainer');
        const tutorialHint = document.getElementById('tutorialHint');
        const topInfoBar = document.getElementById('topInfoBar');
        const topControls = document.getElementById('topControls');

        // 常量
        const GRAVITY = 0.5; 
        const FRICTION = 0.85; 
        const AIR_RESISTANCE = 0.98; 
        const MOVE_SPEED = 0.8; 
        const MAX_SPEED_X = 7; 
        const JUMP_CHARGE_RATE = 0.5; 
        const MAX_JUMP_FORCE = 19; 
        const MIN_JUMP_FORCE = 5; 
        
        // 状态
        const gameState = {
            screen: 'START', // START, PLAYING, GAMEOVER, WIN, LEVEL_COMPLETE
            mode: 'easy', 
            currentLevel: 0,
            charging: false,
            chargePower: 0,
            keys: { left: false, right: false, space: false },
            time: 0,
            touchStartX: 0, 
            touchCurrentX: 0
        };

        const camera = {
            x: 0, y: 0, width: 0, height: 0,
            targetX: 0, targetY: 0,
            follow: function(target) {
                // 如果是开始界面，摄像机自动平移跟随
                if (gameState.screen === 'START') {
                    // 保持小球在屏幕相对固定的位置，或者仅仅跟随X轴
                    this.targetX = target.x - this.width / 2;
                    // Y轴可以稍微平滑一点
                    this.targetY = target.y - this.height / 2;
                    
                    this.x += (this.targetX - this.x) * 0.1;
                    this.y += (this.targetY - this.y) * 0.05;
                    return;
                }
                this.targetX = target.x - this.width / 3; 
                this.targetY = target.y - this.height / 1.8;
                this.x += (this.targetX - this.x) * 0.08;
                this.y += (this.targetY - this.y) * 0.08;
                if(this.x < -200) this.x = -200;
            }
        };

        const background = {
            stars: [],
            init: function() {
                this.stars = [];
                for(let i=0; i<80; i++) {
                    this.stars.push({
                        x: Math.random() * 2000, 
                        y: Math.random() * 1000, 
                        size: Math.random() * 2 + 0.5,
                        alpha: Math.random(),
                        speed: Math.random() * 0.2
                    });
                }
            },
            draw: function(ctx, camX, camY) {
                const w = canvas.width;
                const h = canvas.height;
                const grd = ctx.createLinearGradient(0, 0, 0, h);
                grd.addColorStop(0, '#020617'); 
                grd.addColorStop(1, '#111827'); 
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, w, h);

                // 动态网格背景
                ctx.save();
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.05)';
                ctx.lineWidth = 1;
                const gridSize = 100;
                const offsetX = -camX % gridSize;
                const offsetY = -camY % gridSize;
                ctx.beginPath();
                for(let x=offsetX; x<w; x+=gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
                for(let y=offsetY; y<h; y+=gridSize) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
                ctx.stroke();
                ctx.restore();

                // 星星
                ctx.save();
                ctx.translate(-camX * 0.05, -camY * 0.05);
                ctx.fillStyle = 'white';
                this.stars.forEach(s => {
                    const flicker = Math.sin(gameState.time * 0.05 + s.x) * 0.3;
                    ctx.globalAlpha = Math.max(0.1, s.alpha + flicker);
                    ctx.beginPath();
                    ctx.arc((s.x + gameState.time * s.speed) % 2000 + (Math.floor(camX*0.05/2000)*2000), s.y, s.size, 0, Math.PI*2);
                    ctx.fill();
                });
                ctx.restore();
            }
        };

        // --- 类 ---
        class Ball {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.radius = 14;
                this.vx = 0; this.vy = 0;
                this.isGrounded = false;
                this.canDoubleJump = true; 
                this.squashX = 1; this.squashY = 1;
                this.dead = false;
                this.trail = []; 
                this.autoMode = false; // 是否为自动演示模式
            }
            update() {
                // 如果在演示模式下死了，重置位置继续跑
                if (this.dead && this.autoMode) {
                    this.resetDemo();
                    return;
                }
                if (this.dead) return;

                if (gameState.time % 2 === 0 && (Math.abs(this.vx) > 1 || Math.abs(this.vy) > 1)) {
                    this.trail.push({x: this.x, y: this.y, alpha: 0.6, r: this.radius});
                    if (this.trail.length > 8) this.trail.shift();
                }

                // 自动演示逻辑 (Safe Demo AI)
                if (this.autoMode) {
                    this.vx = 4; // 稍微快一点
                    if (this.isGrounded) {
                        this.jump(13); // 规律跳跃
                    }
                    // 如果跑太远了，把球拉回来循环演示
                    if (this.x > 5000) {
                        this.resetDemo();
                    }
                } else {
                    // 玩家控制
                    if (gameState.keys.left) this.vx -= MOVE_SPEED;
                    if (gameState.keys.right) this.vx += MOVE_SPEED;

                    if (gameState.keys.space && (this.isGrounded || this.canDoubleJump)) {
                        gameState.charging = true;
                        if (!this.isGrounded) {
                            this.vy *= 0.8; 
                            if (Math.abs(this.vy) < 0.5) this.vy = 0;
                            this.vx *= 0.95; 
                            if (Math.random() < 0.5) createParticles(this.x + (Math.random()-0.5)*20, this.y + this.radius, 1, '#60a5fa'); 
                        } else {
                            if (Math.random() < 0.3) createParticles(this.x + (Math.random()-0.5)*20, this.y + this.radius, 1, '#fbbf24');
                        }
                        if (gameState.chargePower < MAX_JUMP_FORCE) gameState.chargePower += JUMP_CHARGE_RATE;
                        const squashFactor = 1 - (gameState.chargePower / MAX_JUMP_FORCE) * 0.4;
                        this.squashY = squashFactor;
                        this.squashX = 1 + (1 - squashFactor) * 0.8;
                    } else {
                        if (gameState.charging) {
                            if (!this.isGrounded) {
                                this.canDoubleJump = false;
                                createParticles(this.x, this.y, 10, '#3b82f6'); 
                            }
                            this.jump(Math.max(MIN_JUMP_FORCE, gameState.chargePower));
                            gameState.charging = false;
                            gameState.chargePower = 0;
                        }
                        this.squashX += (1 - this.squashX) * 0.15;
                        this.squashY += (1 - this.squashY) * 0.15;
                    }
                }

                this.vy += GRAVITY;
                this.vx *= this.isGrounded ? FRICTION : AIR_RESISTANCE;
                if (this.vx > MAX_SPEED_X) this.vx = MAX_SPEED_X;
                if (this.vx < -MAX_SPEED_X) this.vx = -MAX_SPEED_X;

                this.x += this.vx; this.y += this.vy;
                
                // 掉落深渊逻辑
                if (this.y > camera.y + camera.height + 300) {
                    if (this.autoMode) {
                        this.resetDemo();
                    } else {
                        game.gameOver("坠入深渊");
                    }
                }
            }
            
            resetDemo() {
                this.x = 0; 
                this.y = 400;
                this.vx = 0;
                this.vy = 0;
                this.dead = false;
                // 重置摄像机
                camera.x = -200;
            }

            jump(force) {
                this.vy = -force;
                this.isGrounded = false;
                createParticles(this.x, this.y + this.radius, 8, '#fff');
            }
            draw(ctx) {
                if (this.dead) return;
                this.trail.forEach(t => {
                    t.alpha -= 0.05; t.r *= 0.9;
                    if(t.alpha > 0) {
                        ctx.fillStyle = `rgba(56, 189, 248, ${t.alpha})`; 
                        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2); ctx.fill();
                    }
                });
                this.trail = this.trail.filter(t => t.alpha > 0);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.squashX, this.squashY);
                if (!this.isGrounded && this.canDoubleJump) {
                    ctx.shadowBlur = 20; ctx.shadowColor = "#60a5fa"; 
                } else {
                    ctx.shadowBlur = 15; ctx.shadowColor = "#22d3ee"; 
                }
                const grd = ctx.createRadialGradient(-4, -4, 2, 0, 0, this.radius);
                grd.addColorStop(0, '#e0f2fe'); grd.addColorStop(0.5, '#38bdf8'); grd.addColorStop(1, '#0ea5e9'); 
                ctx.fillStyle = gameState.charging ? `rgb(255, ${200 * (1-gameState.chargePower / MAX_JUMP_FORCE)}, 100)` : grd;
                if (gameState.charging) ctx.shadowColor = "#fbbf24";
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
                
                ctx.shadowBlur = 0; ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(5, -3, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(-5, -3, 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#0f172a';
                const lookX = this.vx * 0.3; const lookY = this.vy * 0.3;
                ctx.beginPath(); ctx.arc(5 + lookX, -3 + lookY, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(-5 + lookX, -3 + lookY, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
        }

        class Platform {
            constructor(x, y, w, h, type, props = {}) {
                this.x = x; this.y = y; this.w = w; this.h = h; this.type = type;
                this.active = true;
                
                // 属性初始化
                this.initialX = x;
                this.initialY = y;
                // 移动地刺/平台属性
                this.moveRange = props.moveRange || 0;
                this.moveSpeed = props.moveSpeed || 2;
                this.moveDir = 1;
                // 碎裂方块属性
                this.crumbleTimer = 0;
                this.isCrumbling = false;
                // 旋转锯齿属性
                this.angle = 0;
                this.radius = props.radius || 30; // 锯齿半径
            }
            
            update() {
                const time = gameState.time;
                
                // 移动逻辑 (Moving Spike)
                if (this.moveRange > 0) {
                    this.x += this.moveSpeed * this.moveDir;
                    if (this.x > this.initialX + this.moveRange || this.x < this.initialX) {
                        this.moveDir *= -1;
                    }
                }
                
                // 碎裂逻辑 (Fragile)
                if (this.isCrumbling) {
                    this.crumbleTimer++;
                    if (this.crumbleTimer > 60) { // 1秒后消失
                        this.active = false;
                        createParticles(this.x + this.w/2, this.y + this.h/2, 10, '#94a3b8');
                    }
                }

                // 旋转逻辑 (Saw)
                if (this.type === 'saw') {
                    this.angle += 0.1;
                }
            }

            draw(ctx) {
                if (!this.active) return;
                const time = gameState.time;
                
                if (this.type === 'normal' || this.type === 'fragile') {
                    // 碎裂方块特殊颜色
                    if (this.type === 'fragile') {
                        if (this.isCrumbling) {
                            // 抖动效果
                            const shake = (Math.random() - 0.5) * 4;
                            ctx.translate(shake, shake);
                            ctx.fillStyle = '#ef4444'; // 变红
                        } else {
                            ctx.fillStyle = '#64748b'; // 灰色
                        }
                    } else {
                        ctx.fillStyle = '#1e293b'; 
                    }

                    ctx.fillRect(this.x, this.y, this.w, this.h);
                    ctx.lineWidth = 2; ctx.strokeStyle = '#334155'; ctx.strokeRect(this.x, this.y, this.w, this.h);
                    
                    if (this.type !== 'fragile') {
                        ctx.shadowBlur = 10; ctx.shadowColor = '#4ade80'; 
                        ctx.fillStyle = '#4ade80'; ctx.fillRect(this.x, this.y, this.w, 4);
                        ctx.shadowBlur = 0; 
                    } else {
                         // 碎裂纹路
                         ctx.strokeStyle = '#fff';
                         ctx.beginPath();
                         ctx.moveTo(this.x + 10, this.y + 10);
                         ctx.lineTo(this.x + this.w - 10, this.y + this.h - 10);
                         ctx.stroke();
                    }
                    if (this.isCrumbling && this.type === 'fragile') ctx.translate(0, 0); // Reset transform

                } else if (this.type === 'spike') {
                    ctx.fillStyle = '#991b1b'; 
                    const spikeWidth = 20; const spikeCount = Math.floor(this.w / spikeWidth);
                    ctx.save();
                    ctx.shadowBlur = 10; ctx.shadowColor = '#ef4444'; 
                    ctx.beginPath();
                    for(let i=0; i<spikeCount; i++) {
                        ctx.moveTo(this.x + i * spikeWidth, this.y + this.h);
                        ctx.lineTo(this.x + i * spikeWidth + spikeWidth/2, this.y);
                        ctx.lineTo(this.x + i * spikeWidth + spikeWidth, this.y + this.h);
                    }
                    const grd = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
                    grd.addColorStop(0, '#fca5a5'); grd.addColorStop(1, '#7f1d1d'); 
                    ctx.fillStyle = grd; ctx.fill(); ctx.restore();

                } else if (this.type === 'moving_spike') {
                    // 移动地刺基座
                    ctx.fillStyle = '#334155';
                    ctx.fillRect(this.initialX, this.y + 20, this.moveRange + this.w, 10); // 轨道

                    // 刺本体
                    ctx.save();
                    ctx.shadowBlur = 10; ctx.shadowColor = '#ef4444'; 
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + this.h);
                    ctx.lineTo(this.x + this.w/2, this.y);
                    ctx.lineTo(this.x + this.w, this.y + this.h);
                    ctx.fill();
                    ctx.restore();

                } else if (this.type === 'saw') {
                    // 旋转锯齿
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    
                    ctx.shadowBlur = 15; ctx.shadowColor = '#ef4444';
                    ctx.fillStyle = '#b91c1c';
                    ctx.beginPath();
                    
                    // 画齿轮
                    const teeth = 8;
                    const outerRadius = this.radius;
                    const innerRadius = this.radius * 0.5;
                    for (let i = 0; i < teeth * 2; i++) {
                        const r = (i % 2 === 0) ? outerRadius : innerRadius;
                        const a = (Math.PI * 2 * i) / (teeth * 2);
                        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                    
                    // 中心
                    ctx.fillStyle = '#450a0a';
                    ctx.beginPath(); ctx.arc(0,0, innerRadius/2, 0, Math.PI*2); ctx.fill();
                    ctx.restore();

                } else if (this.type === 'goal') {
                    ctx.save();
                    const cx = this.x + this.w/2; const cy = this.y + this.h/2;
                    ctx.translate(cx, cy);
                    ctx.rotate(time * 0.05);
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 4; ctx.setLineDash([10, 10]);
                    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.stroke();
                    ctx.shadowBlur = 20; ctx.shadowColor = '#fff'; ctx.fillStyle = '#ecfdf5';
                    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                } else if (this.type === 'text') {
                    ctx.save();
                    ctx.fillStyle = "rgba(255,255,255,0.7)";
                    ctx.font = "bold 20px 'Segoe UI'";
                    ctx.fillText(this.w, this.x, this.y);
                    ctx.restore();
                }
            }
        }

        let particles = [];
        function createParticles(x, y, count, color) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 1) * 8,
                    size: Math.random() * 3 + 1, life: 1.0, color: color, gravity: 0.2
                });
            }
        }

        // --- 关卡数据 ---
        
        // 演示专用关卡 (无限安全跑道)
        const demoLevel = {
             start: {x: 0, y: 400},
             platforms: [
                 // 一个极长的安全地面，每隔一段距离有一些小墩子跳着玩
                 {x: -200, y: 500, w: 10000, h: 200, type: 'normal'},
                 // 装饰性的小障碍 (无害)
                 {x: 600, y: 450, w: 50, h: 50, type: 'normal'},
                 {x: 1200, y: 400, w: 50, h: 100, type: 'normal'},
                 {x: 1800, y: 450, w: 50, h: 50, type: 'normal'},
                 {x: 2400, y: 400, w: 50, h: 100, type: 'normal'},
                 {x: 3000, y: 450, w: 50, h: 50, type: 'normal'},
                 {x: 3600, y: 400, w: 50, h: 100, type: 'normal'},
                 {x: 4200, y: 450, w: 50, h: 50, type: 'normal'},
             ]
        };

        // 简单模式 (10关)
        const generateEasyLevels = () => {
            const levels = [];
            for(let i=1; i<=10; i++) {
                const len = 1500 + i * 200; 
                const hasSpikes = i > 2; 
                const hasMovingSpikes = i > 4;
                const hasFragile = i > 6;
                const hasSaws = i > 8;
                
                let plats = [
                    {x: -100, y: 500, w: 400, h: 200, type: 'normal'},
                    {x: 50, y: 350, w: `第 ${i} 关`, h: 0, type: 'text'}
                ];

                let cx = 350;
                while(cx < len) {
                    const gap = 120 + Math.random() * 80;
                    const heightVar = (Math.random() - 0.5) * 80;
                    const w = 100 + Math.random() * 100;
                    
                    // 障碍物生成逻辑
                    if (hasSaws && Math.random() < 0.2) {
                        plats.push({x: cx + gap/2, y: 450 + heightVar, w: 0, h: 0, type: 'saw', radius: 25});
                    }

                    if (hasMovingSpikes && Math.random() < 0.3) {
                        plats.push({x: cx + gap, y: 500 + heightVar - 20, w: 20, h: 20, type: 'moving_spike', moveRange: w - 20, moveSpeed: 1.5});
                        plats.push({x: cx + gap, y: 500 + heightVar, w: w, h: 50, type: 'normal'});
                    } else if (hasFragile && Math.random() < 0.3) {
                        plats.push({x: cx + gap, y: 500 + heightVar, w: w, h: 50, type: 'fragile'});
                    } else {
                        plats.push({x: cx + gap, y: 500 + heightVar, w: w, h: 50, type: 'normal'});
                        if (hasSpikes && Math.random() < 0.3) {
                             plats.push({x: cx + gap/2, y: 600, w: gap, h: 50, type: 'spike'});
                        }
                    }
                    cx += gap + w;
                }
                plats.push({x: cx + 100, y: 450, w: 60, h: 80, type: 'goal'});
                levels.push({ start: {x: 50, y: 400}, platforms: plats });
            }
            return levels;
        };

        const easyLevels = generateEasyLevels();

        // 困难模式
        const hardLevels = [
            // 第一关：陷阱初现
            {
                start: {x: 50, y: 300},
                platforms: [
                    {x: -100, y: 400, w: 500, h: 200, type: 'normal'},
                    {x: 50, y: 300, w: "困难模式", h: 0, type: 'text'},
                    {x: 400, y: 350, w: 200, h: 50, type: 'normal'}, 
                    {x: 650, y: 330, w: 20, h: 20, type: 'moving_spike', moveRange: 200, moveSpeed: 3},
                    {x: 650, y: 350, w: 250, h: 50, type: 'normal'},
                    {x: 950, y: 300, w: 60, h: 20, type: 'fragile'},
                    {x: 1050, y: 250, w: 60, h: 20, type: 'fragile'},
                    {x: 1150, y: 200, w: 60, h: 20, type: 'fragile'},
                    {x: 1100, y: 150, w: 0, h: 0, type: 'saw', radius: 20},
                    {x: 1300, y: 300, w: 200, h: 200, type: 'normal'}, 
                    {x: 1550, y: 220, w: 60, h: 80, type: 'goal'}
                ]
            },
            // 第二关：史诗长关
            {
                start: {x: 50, y: 400},
                platforms: [
                    {x: -200, y: 500, w: 500, h: 500, type: 'normal'},
                    {x: 300, y: 700, w: 600, h: 50, type: 'spike'}, 
                    {x: 350, y: 400, w: 80, h: 20, type: 'fragile'}, 
                    {x: 550, y: 300, w: 80, h: 20, type: 'fragile'}, 
                    {x: 750, y: 450, w: 80, h: 20, type: 'fragile'}, 
                    {x: 900, y: 500, w: 300, h: 50, type: 'normal'},
                    {x: 1050, y: 450, w: 0, h: 0, type: 'saw', radius: 40},
                    {x: 1250, y: 450, w: 0, h: 0, type: 'saw', radius: 40},
                    {x: 1450, y: 600, w: 400, h: 50, type: 'spike'}, 
                    {x: 1550, y: 400, w: 20, h: 20, type: 'moving_spike', moveRange: 130},
                    {x: 1550, y: 420, w: 150, h: 20, type: 'normal'}, 
                    {x: 1800, y: 300, w: 80, h: 20, type: 'normal'}, 
                    {x: 2000, y: 200, w: 200, h: 50, type: 'normal'},
                    {x: 2100, y: 120, w: 60, h: 80, type: 'goal'}
                ]
            }
        ];

        // --- 主逻辑 ---
        const game = {
            ball: null,
            platforms: [],
            
            init: function() {
                background.init();
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.setupInputs();
                
                // 启动演示模式
                this.startDemoMode();
            },
            
            resize: function() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                camera.width = canvas.width; camera.height = canvas.height;
            },

            // 首页演示模式
            startDemoMode: function() {
                gameState.screen = 'START';
                // 加载演示用的安全关卡
                this.loadLevelData(demoLevel); 
                this.ball.autoMode = true; // 开启AI控制
                
                topInfoBar.style.display = 'none';
                topControls.style.display = 'none';
                overlay.style.display = 'flex';
                overlay.style.pointerEvents = 'none'; // 让点击穿透，除了里面的按钮
                document.querySelector('#overlay > div.pointer-events-auto').style.pointerEvents = 'auto';
            },

            startMode: function(mode) {
                this.mode = mode;
                overlay.style.display = 'none'; // 隐藏遮罩
                topInfoBar.style.display = 'flex';
                topControls.style.display = 'flex';
                this.loadLevel(0);
            },

            loadLevel: function(levelIndex) {
                const levels = (this.mode === 'easy' ? easyLevels : hardLevels);
                
                if (levelIndex >= levels.length) {
                    this.showScreen('WIN', "通关！");
                    return;
                }
                
                gameState.currentLevel = levelIndex;
                levelDisplay.textContent = levelIndex + 1;
                modeDisplay.textContent = this.mode === 'easy' ? '简单' : '困难';
                
                this.loadLevelData(levels[levelIndex]);
                this.showScreen('PLAYING');
            },

            loadLevelData: function(levelData) {
                this.ball = new Ball(levelData.start.x, levelData.start.y);
                this.platforms = levelData.platforms.map(p => new Platform(p.x, p.y, p.w, p.h, p.type, p));
                
                gameState.charging = false; gameState.chargePower = 0;
                gameState.keys.space = false; gameState.keys.left = false; gameState.keys.right = false;
            },

            resetLevel: function() {
                this.loadLevel(gameState.currentLevel);
            },

            gameOver: function(reason) {
                createParticles(this.ball.x, this.ball.y, 30, '#38bdf8');
                this.ball.dead = true;
                setTimeout(() => this.showScreen('GAMEOVER', reason), 600);
            },

            showScreen: function(screenName, msg = "") {
                gameState.screen = screenName;
                
                if (screenName === 'START') {
                    this.startDemoMode();
                    return;
                }

                if (screenName === 'PLAYING') {
                    overlay.style.display = 'none';
                    powerBarContainer.style.display = 'block';
                } else {
                    overlay.style.display = 'flex';
                    overlay.style.pointerEvents = 'auto'; 
                    powerBarContainer.style.display = 'none';
                    tutorialHint.style.display = 'none';
                    
                    // 隐藏开始菜单按钮
                    startMenuButtons.style.display = 'none';
                    actionBtn.style.display = 'block';
                    
                    // 隐藏标题区域的小球动画 (避免遮挡)
                    document.querySelector('.title-bouncer-container').style.display = 'none';

                    if (screenName === 'GAMEOVER') {
                        overlayTitle.textContent = "破碎";
                        overlayDesc.textContent = msg || "再试一次";
                        actionBtn.textContent = "重试";
                        actionBtn.onclick = () => this.resetLevel();
                    } else if (screenName === 'WIN') {
                        overlayTitle.textContent = "传奇";
                        overlayDesc.textContent = msg;
                        actionBtn.textContent = "返回主菜单";
                        actionBtn.onclick = () => {
                             document.querySelector('.title-bouncer-container').style.display = 'block';
                             startMenuButtons.style.display = 'flex';
                             this.showScreen('START');
                        };
                    } else if (screenName === 'LEVEL_COMPLETE') {
                        overlayTitle.textContent = "完成";
                        overlayDesc.textContent = "继续前进";
                        actionBtn.textContent = "下一关";
                        actionBtn.onclick = () => this.loadLevel(gameState.currentLevel + 1);
                    }
                }
            },

            checkCollisions: function() {
                const ball = this.ball;
                if (ball.dead) return;
                
                ball.isGrounded = false;

                for (let p of this.platforms) {
                    if (!p.active) continue;
                    if (p.type === 'text') continue;

                    // 圆形碰撞 (锯齿)
                    if (p.type === 'saw') {
                        const dx = ball.x - p.x;
                        const dy = ball.y - p.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < ball.radius + p.radius) {
                             if (!ball.autoMode) this.gameOver("被锯齿撕裂");
                             else ball.dead = true;
                        }
                        continue;
                    }

                    // 矩形碰撞
                    let closestX = Math.max(p.x, Math.min(ball.x, p.x + p.w));
                    let closestY = Math.max(p.y, Math.min(ball.y, p.y + p.h));
                    let dx = ball.x - closestX; let dy = ball.y - closestY;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < ball.radius) {
                        if (p.type === 'spike' || p.type === 'moving_spike') {
                            if (!ball.autoMode) this.gameOver("接触危险尖刺");
                            else ball.dead = true;
                            return;
                        } else if (p.type === 'goal') {
                            if (!ball.autoMode) this.showScreen('LEVEL_COMPLETE');
                            else { 
                                 // 演示模式碰到终点重置
                                 this.ball.resetDemo();
                            }
                            return;
                        } else if (p.type === 'normal' || p.type === 'fragile') {
                            const isFalling = ball.vy >= 0;
                            const isAbove = ball.y < p.y + p.h / 2; 
                            const isAligned = ball.x > p.x - ball.radius * 0.5 && ball.x < p.x + p.w + ball.radius * 0.5;

                            if (isFalling && isAbove && isAligned) {
                                ball.y = p.y - ball.radius; ball.vy = 0;
                                ball.isGrounded = true; ball.canDoubleJump = true; 
                                if (p.type === 'fragile') p.isCrumbling = true; 
                                if (Math.abs(ball.vy) > 2) createParticles(ball.x, ball.y + ball.radius, 3, '#4ade80');
                            } else if (ball.vy < 0 && ball.y > p.y + p.h - ball.radius && isAligned) {
                                ball.y = p.y + p.h + ball.radius; ball.vy *= -0.5;
                            } else {
                                 if (ball.x < p.x + p.w / 2) { 
                                    ball.x = p.x - ball.radius; ball.vx = -Math.abs(ball.vx) * 0.5; 
                                 } else { 
                                    ball.x = p.x + p.w + ball.radius; ball.vx = Math.abs(ball.vx) * 0.5; 
                                 }
                            }
                        }
                    }
                }
            },

            update: function() {
                gameState.time++;
                this.platforms.forEach(p => p.update()); 
                if (this.ball) this.ball.update();
                this.checkCollisions();
                
                for(let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.vy += p.gravity; 
                    p.life -= 0.03; p.size *= 0.95;
                    if(p.life <= 0) particles.splice(i, 1);
                }
                
                if (this.ball) camera.follow(this.ball);
                
                if (gameState.screen === 'PLAYING') {
                     powerBar.style.height = gameState.charging ? (gameState.chargePower / MAX_JUMP_FORCE * 100) + '%' : '0%';
                }
            },

            draw: function() {
                background.draw(ctx, camera.x, camera.y);
                ctx.save();
                ctx.translate(-camera.x, -camera.y);
                this.platforms.forEach(p => p.draw(ctx));
                if (this.ball) this.ball.draw(ctx);
                particles.forEach(p => {
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1.0;
                });
                ctx.restore();
            },

            setupInputs: function() {
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'ArrowLeft') gameState.keys.left = true;
                    if (e.code === 'ArrowRight') gameState.keys.right = true;
                    if (e.code === 'Space') gameState.keys.space = true;
                });
                window.addEventListener('keyup', (e) => {
                    if (e.code === 'ArrowLeft') gameState.keys.left = false;
                    if (e.code === 'ArrowRight') gameState.keys.right = false;
                    if (e.code === 'Space') gameState.keys.space = false;
                });
                const handleTouchStart = (e) => {
                    if (e.target.closest('.btn') || e.target.tagName === 'BUTTON') return;
                    if (gameState.screen === 'PLAYING') e.preventDefault();
                    if (gameState.screen !== 'PLAYING') return; 
                    
                    gameState.keys.space = true;
                    if(e.touches.length > 0) {
                        gameState.touchStartX = e.touches[0].clientX;
                        gameState.touchCurrentX = gameState.touchStartX;
                    }
                };
                const handleTouchMove = (e) => {
                    if (!gameState.keys.space) return;
                    e.preventDefault();
                    if(e.touches.length > 0) {
                        gameState.touchCurrentX = e.touches[0].clientX;
                        const delta = gameState.touchCurrentX - gameState.touchStartX;
                        const threshold = 15; 
                        if (delta < -threshold) { gameState.keys.left = true; gameState.keys.right = false; }
                        else if (delta > threshold) { gameState.keys.right = true; gameState.keys.left = false; }
                        else { gameState.keys.left = false; gameState.keys.right = false; }
                    }
                };
                const handleTouchEnd = (e) => {
                    if (gameState.keys.space) {
                        e.preventDefault();
                        gameState.keys.space = false; gameState.keys.left = false; gameState.keys.right = false;
                    }
                };
                window.addEventListener('touchstart', handleTouchStart, {passive: false});
                window.addEventListener('touchmove', handleTouchMove, {passive: false});
                window.addEventListener('touchend', handleTouchEnd, {passive: false});
            }
        };

        function loop() {
            game.update();
            game.draw();
            requestAnimationFrame(loop);
        }

        game.init();
        loop();

    </script>
</body>
